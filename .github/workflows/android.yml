name: Gerar APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      atualizar_site:
        description: "Baixar a versão mais nova do site (fael0306/dino) antes de compilar"
        type: boolean
        default: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Atualizar o site embutido (opcional)
        if: ${{ inputs.atualizar_site }}
        run: ./scripts/atualizar-site.sh

      - name: Baixar bibliotecas para uso offline
        run: ./scripts/baixar-bibliotecas.sh

      - name: Instalar o JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar o Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Testes
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Compilar o APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Publicar o APK
        uses: actions/upload-artifact@v4
        with:
          name: PaleoLab-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
