# Limita a memória do Gradle para 2GB (evita que ele coma tudo)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Limita a memória do compilador do Kotlin para 1.5GB
kotlin.daemon.jvmargs=-Xmx1536m

# Desativa a compilação paralela (economiza muita RAM, deixa o build um pouco mais lento)
org.gradle.parallel=false

# Otimiza o cache
org.gradle.caching=true